org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.caching=true
kotlin.code.style=official
android.useAndroidX=true
android.nonTransitiveRClass=true

# --- Maven Central publishing metadata (com.vanniktech.maven.publish) ------------------------
# Single source of truth for coordinates and POM metadata shared by all published library
# modules (:maradona, :maradona-material3, :maradona-jewel). Sample modules do not apply the
# publish plugin.
#
# VERSION_NAME stays -SNAPSHOT on master; the tag-driven release workflow overrides it via
# -PVERSION_NAME=<semver> (for example v0.1.0 -> 0.1.0).
GROUP=dev.sebastiano.maradona
VERSION_NAME=0.1.0-SNAPSHOT

POM_INCEPTION_YEAR=2026
POM_URL=https://github.com/rock3r/maradona/
POM_LICENSE_NAME=The Apache Software License, Version 2.0
POM_LICENSE_URL=https://www.apache.org/licenses/LICENSE-2.0.txt
POM_LICENSE_DIST=repo

POM_SCM_URL=https://github.com/rock3r/maradona/
POM_SCM_CONNECTION=scm:git:git://github.com/rock3r/maradona.git
POM_SCM_DEV_CONNECTION=scm:git:ssh://git@github.com/rock3r/maradona.git

POM_DEVELOPER_ID=rock3r
POM_DEVELOPER_NAME=Sebastiano Poggi
POM_DEVELOPER_URL=https://github.com/rock3r/
