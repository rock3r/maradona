<svg id="my-svg" width="100%" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1026 109" style="max-width: 1026px; background-color: rgb(255, 252, 240);" role="graphics-document document" aria-roledescription="packet"><style>#my-svg{font-family:Roboto,sans-serif;font-size:14px;fill:#100F0F;}@keyframes edge-animation-frame{from{stroke-dashoffset:0;}}@keyframes dash{to{stroke-dashoffset:0;}}#my-svg .edge-animation-slow{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 50s linear infinite;stroke-linecap:round;}#my-svg .edge-animation-fast{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 20s linear infinite;stroke-linecap:round;}#my-svg .error-icon{fill:hsl(230.7692307692, 33.3333333333%, 97.3529411765%);}#my-svg .error-text{fill:rgb(8.9999999999, 8.3076923076, 4.5);stroke:rgb(8.9999999999, 8.3076923076, 4.5);}#my-svg .edge-thickness-normal{stroke-width:1px;}#my-svg .edge-thickness-thick{stroke-width:3.5px;}#my-svg .edge-pattern-solid{stroke-dasharray:0;}#my-svg .edge-thickness-invisible{stroke-width:0;fill:none;}#my-svg .edge-pattern-dashed{stroke-dasharray:3;}#my-svg .edge-pattern-dotted{stroke-dasharray:2;}#my-svg .marker{fill:#100F0F;stroke:#100F0F;}#my-svg .marker.cross{stroke:#100F0F;}#my-svg svg{font-family:Roboto,sans-serif;font-size:14px;}#my-svg p{margin:0;}#my-svg .packetByte{font-size:10px;}#my-svg .packetByte.start{fill:black;}#my-svg .packetByte.end{fill:black;}#my-svg .packetLabel{fill:black;font-size:12px;}#my-svg .packetTitle{fill:black;font-size:14px;}#my-svg .packetBlock{stroke:black;stroke-width:1;fill:#efefef;}#my-svg .node .neo-node{stroke:#8A8878;}#my-svg [data-look="neo"].node rect,#my-svg [data-look="neo"].cluster rect,#my-svg [data-look="neo"].node polygon{stroke:#8A8878;filter:none;}#my-svg [data-look="neo"].swimlane.cluster rect{filter:none;}#my-svg [data-look="neo"].node path{stroke:#8A8878;stroke-width:1px;}#my-svg [data-look="neo"].node .outer-path{filter:none;}#my-svg [data-look="neo"].node .neo-line path{stroke:#8A8878;filter:none;}#my-svg [data-look="neo"].node circle{stroke:#8A8878;filter:none;}#my-svg [data-look="neo"].node circle .state-start{fill:#000000;}#my-svg [data-look="neo"].icon-shape .icon{fill:#8A8878;filter:none;}#my-svg [data-look="neo"].icon-shape .icon-neo path{stroke:#8A8878;filter:none;}#my-svg :root{--mermaid-font-family:"trebuchet ms",verdana,arial,sans-serif;}</style><g/><g><rect x="1" y="15" width="507" height="32" class="packetBlock"/><text x="254.5" y="31" class="packetLabel" dominant-baseline="middle" text-anchor="middle">Source Port</text><text x="1" y="13" class="packetByte start" dominant-baseline="auto" text-anchor="start">0</text><text x="508" y="13" class="packetByte end" dominant-baseline="auto" text-anchor="end">15</text><rect x="513" y="15" width="507" height="32" class="packetBlock"/><text x="766.5" y="31" class="packetLabel" dominant-baseline="middle" text-anchor="middle">Destination Port</text><text x="513" y="13" class="packetByte start" dominant-baseline="auto" text-anchor="start">16</text><text x="1020" y="13" class="packetByte end" dominant-baseline="auto" text-anchor="end">31</text></g><g><rect x="1" y="62" width="507" height="32" class="packetBlock"/><text x="254.5" y="78" class="packetLabel" dominant-baseline="middle" text-anchor="middle">Length</text><text x="1" y="60" class="packetByte start" dominant-baseline="auto" text-anchor="start">32</text><text x="508" y="60" class="packetByte end" dominant-baseline="auto" text-anchor="end">47</text><rect x="513" y="62" width="507" height="32" class="packetBlock"/><text x="766.5" y="78" class="packetLabel" dominant-baseline="middle" text-anchor="middle">Checksum</text><text x="513" y="60" class="packetByte start" dominant-baseline="auto" text-anchor="start">48</text><text x="1020" y="60" class="packetByte end" dominant-baseline="auto" text-anchor="end">63</text></g><text x="513" y="85.5" dominant-baseline="middle" text-anchor="middle" class="packetTitle"/></svg>