<svg id="my-svg" width="100%" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 589.5 450" style="max-width: 589.5px; background-color: rgb(255, 252, 240);" role="graphics-document document" aria-roledescription="pie"><style>#my-svg{font-family:Roboto,sans-serif;font-size:14px;fill:#100F0F;}@keyframes edge-animation-frame{from{stroke-dashoffset:0;}}@keyframes dash{to{stroke-dashoffset:0;}}#my-svg .edge-animation-slow{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 50s linear infinite;stroke-linecap:round;}#my-svg .edge-animation-fast{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 20s linear infinite;stroke-linecap:round;}#my-svg .error-icon{fill:hsl(230.7692307692, 33.3333333333%, 97.3529411765%);}#my-svg .error-text{fill:rgb(8.9999999999, 8.3076923076, 4.5);stroke:rgb(8.9999999999, 8.3076923076, 4.5);}#my-svg .edge-thickness-normal{stroke-width:1px;}#my-svg .edge-thickness-thick{stroke-width:3.5px;}#my-svg .edge-pattern-solid{stroke-dasharray:0;}#my-svg .edge-thickness-invisible{stroke-width:0;fill:none;}#my-svg .edge-pattern-dashed{stroke-dasharray:3;}#my-svg .edge-pattern-dotted{stroke-dasharray:2;}#my-svg .marker{fill:#100F0F;stroke:#100F0F;}#my-svg .marker.cross{stroke:#100F0F;}#my-svg svg{font-family:Roboto,sans-serif;font-size:14px;}#my-svg p{margin:0;}#my-svg .pieCircle{stroke:black;stroke-width:2px;opacity:0.7;}#my-svg .pieCircle.highlighted{scale:1.05;opacity:1;}#my-svg .pieCircle.highlightedOnHover:hover{transition-duration:250ms;scale:1.05;opacity:1;}#my-svg .pieOuterCircle{stroke:black;stroke-width:2px;fill:none;}#my-svg .pieTitleText{text-anchor:middle;font-size:25px;fill:#100F0F;font-family:Roboto,sans-serif;}#my-svg .slice{font-family:Roboto,sans-serif;fill:#100F0F;font-size:17px;}#my-svg .legend text{fill:#100F0F;font-family:Roboto,sans-serif;font-size:17px;}#my-svg .node .neo-node{stroke:#8A8878;}#my-svg [data-look="neo"].node rect,#my-svg [data-look="neo"].cluster re