<svg id="my-svg" width="100%" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 567.765625 450" style="max-width: 567.766px; background-color: rgb(255, 252, 240);" role="graphics-document document" aria-roledescription="pie"><style>#my-svg{font-family:Roboto,sans-serif;font-size:14px;fill:#100F0F;}@keyframes edge-animation-frame{from{stroke-dashoffset:0;}}@keyframes dash{to{stroke-dashoffset:0;}}#my-svg .edge-animation-slow{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 50s linear infinite;stroke-linecap:round;}#my-svg .edge-animation-fast{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 20s linear infinite;stroke-linecap:round;}#my-svg .error-icon{fill:hsl(230.7692307692, 33.3333333333%, 97.3529411765%);}#my-svg .error-text{fill:rgb(8.9999999999, 8.3076923076, 4.5);stroke:rgb(8.9999999999, 8.3076923076, 4.5);}#my-svg .edge-thickness-normal{stroke-width:1px;}#my-svg .edge-thickness-thick{stroke-width:3.5px;}#my-svg .edge-pattern-solid{stroke-dasharray:0;}#my-svg .edge-thickness-invisible{stroke-width:0;fill:none;}#my-svg .edge-pattern-dashed{stroke-dasharray:3;}#my-svg .edge-pattern-dotted{stroke-dasharray:2;}#my-svg .marker{fill:#100F0F;stroke:#100F0F;}#my-svg .marker.cross{stroke:#100F0F;}#my-svg svg{font-family:Roboto,sans-serif;font-size:14px;}#my-svg p{margin:0;}#my-svg .pieCircle{stroke:black;stroke-width:2px;opacity:0.7;}#my-svg .pieCircle.highlighted{scale:1.05;opacity:1;}#my-svg .pieCircle.highlightedOnHover:hover{transition-duration:250ms;scale:1.05;opacity:1;}#my-svg .pieOuterCircle{stroke:black;stroke-width:2px;fill:none;}#my-svg .pieTitleText{text-anchor:middle;font-size:25px;fill:#100F0F;font-family:Roboto,sans-serif;}#my-svg .slice{font-family:Roboto,sans-serif;fill:#100F0F;font-size:17px;}#my-svg .legend text{fill:#100F0F;font-family:Roboto,sans-serif;font-size:17px;}#my-svg .node .neo-node{stroke:#8A8878;}#my-svg [data-look="neo"].node rect,#my-svg [data-look="neo"].cluster rect,#my-svg [data-look="neo"].node polygon{stroke:#8A8878;filter:none;}#my-svg [data-look="neo"].swimlane.cluster rect{filter:none;}#my-svg [data-look="neo"].node path{stroke:#8A8878;stroke-width:1px;}#my-svg [data-look="neo"].node .outer-path{filter:none;}#my-svg [data-look="neo"].node .neo-line path{stroke:#8A8878;filter:none;}#my-svg [data-look="neo"].node circle{stroke:#8A8878;filter:none;}#my-svg [data-look="neo"].node circle .state-start{fill:#000000;}#my-svg [data-look="neo"].icon-shape .icon{fill:#8A8878;filter:none;}#my-svg [data-look="neo"].icon-shape .icon-neo path{stroke:#8A8878;filter:none;}#my-svg :root{--mermaid-font-family:"trebuchet ms",verdana,arial,sans-serif;}</style><g/><g transform="translate(225,225)"><g><circle cx="0" cy="0" r="186" class="pieOuterCircle"/><path d="M0,-185A185,185,0,0,1,175.945,-57.168L0,0Z" fill="#F2F0E5" class="pieCircle"/><path d="M175.945,-57.168A185,185,0,0,1,-149.668,108.74L0,0Z" fill="hsl(-69.2307692308, 33.3333333333%, 92.3529411765%)" class="pieCircle"/><path d="M-149.668,108.74A185,185,0,0,1,0,-185L0,0Z" fill="hsl(230.7692307692, 33.3333333333%, 97.3529411765%)" class="pieCircle"/><text transform="translate(81.55520375558065,-112.25110796952396)" class="slice" style="text-anchor: middle;">20%</text><text transform="translate(62.99118183886212,123.62715523113603)" class="slice" style="text-anchor: middle;">45%</text><text transform="translate(-123.62715523113604,-62.991181838862104)" class="slice" style="text-anchor: middle;">35%</text></g><text x="0" y="-200" class="pieTitleText">Runtime Split</text><g class="legend" transform="translate(216,-33)"><rect width="18" height="18" style="fill: rgb(242, 240, 229); stroke: rgb(242, 240, 229);"/><text x="22" y="14">Parse</text></g><g class="legend" transform="translate(216,-11)"><rect width="18" height="18" style="fill: rgb(240, 229, 242); stroke: rgb(240, 229, 242);"/><text x="22" y="14">Layout</text></g><g class="legend" transform="translate(216,11)"><rect width="18