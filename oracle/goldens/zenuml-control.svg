<svg id="my-svg" width="100%" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" style="max-width: 352px; background-color: rgb(255, 252, 240);" viewBox="0 0 352 457" role="graphics-document document" aria-roledescription="zenuml"><defs>
